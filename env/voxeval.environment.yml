# voxeval: the evaluation environment for generated ligands. QED, SA and diversity, AutoDock Vina 1.2.2
# docking, PoseCheck 1.3.1 and PoseBusters 0.6.5 run in one interpreter (python 3.10); the GPU
# pipeline stays in voxbind. This file is the editable spec of the conda layer; the locked build is
#   env/voxeval.conda-linux-64.lock + env/voxeval.pip.lock.txt   (bash script/00_setup_env.sh voxeval)
# The pip layer adds RDKit 2024.9.6 from PyPI (its wheel carries its own Boost, and PoseBusters 0.6.5
# needs RDKit >= 2024.9), Vina 1.2.2 built from its sdist against boost-cpp 1.74 below (no wheel
# exists; the conda-forge build needs an older RDKit), meeko 0.1.dev3, pdb2pqr 3.6.1, propka 3.5.0,
# AutoDockTools_py3 @aee55d5, PoseBusters, ProLIF, datamol, hydride and PoseCheck 1.3.1 (--no-deps,
# it pins pandas 2.0.0).
name: voxeval
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - numpy=1.26.4
  - scipy
  - pandas
  - openbabel=3.1.1
  - boost-cpp=1.74
  - swig
  - cxx-compiler
  - reduce=4.15
  - easydict
  - pip
