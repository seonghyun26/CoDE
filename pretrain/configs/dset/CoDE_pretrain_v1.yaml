# CoDE_pretrain_v1: cdgv2 with the proteins of the paper's test sets removed (identity >= 100%,
# shorter-sequence coverage >= 80%): FULL + CL3 + CL3-ID60 + CL3-ID30 + CASF-nontrain + CASF-clean + CrossDocked-test.
# Built by dataset/plinder/02_make_clean_corpus.py.
# Retained 107516 positions (39070 PDBs); removed 2607 PDBs (5217 positions, 4.628%).
dset_name: crossdocked_xray
data_dir: ${oc.env:VOXBIND_DATA_ROOT,../dataset/data}
data_file: pretrain/data_train_plinder_v2_perelem.pt
crops_dir: ''                  # OTF resample path → no frozen crops
ccp4_dir: ${oc.env:VOXBIND_DATA_ROOT,../dataset/data}/ccp4
resample_dir: ${oc.env:VOXBIND_DATA_ROOT,../dataset/data}/pretrain/xray_resample_CoDE_pretrain_v1
box_path: ${oc.env:VOXBIND_DATA_ROOT,../dataset/data}/pretrain/xray_resample_CoDE_pretrain_v1/box116.dat
ligand_radius: -1              # -1 → per-atom vdW radii from the tuples
pocket_radius: -1
use_xray: true
gradmag_as_density: false
cache_size: 32
normalize: false               # density pre-normalized in the resample recipe
subset_n: 107416
subset_xray_only: true
subset_val_n: 100
