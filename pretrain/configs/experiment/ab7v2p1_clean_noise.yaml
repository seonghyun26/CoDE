# @package _global_
# Table 2 ablation "w. noisy D,G" on the ab7v2p1_clean recipe (atomblob7 v2.1 recipe on CoDE_pretrain_v1, in-vocab
# ligands only): density replaced by voxels drawn from the empirical density histogram (fixed per
# complex), gradmag recomputed from it; groups [7,4,1,1]. The noise path runs on the on-the-fly loader.
defaults:
  - override /dset: CoDE_pretrain_v1
  - override /model: v1
  - override /mae: invfreq
  - override /mask: uniform

exp_name: ab7v2p1_clean_noise
wandb_tags: [pretrain, atomblob7, CoDE_pretrain_v1, in_vocab_only, 40m, channelvit, table2, noise]
bsz: 16              # global batch 128 = 16 x accum 2 x 4 GPUs, as the original run (32 x 4); 32 OOMs on a 3090
accum_steps: 2
dset: {in_vocab_only: true, n_lig_ch: 7, n_poc_ch: 4, box_path: '', density_noise_distribution: ../legacy/dataset/data/pretrain/cdg_v2_empirical_noise/distribution.npz}
model:
  model_name: atomblob_density_vit_mae_40m
  input_mode: atomblob_density
  with_gradmag: true
  n_in_channels: 13
  channel_groups: [7, 4, 1, 1]
  n_channels_ligand: 7
  n_channels_pocket: 4
mae: {channel_weighting: uniform, val_every: 1, ckpt_every: 20, channel_weight_clip_ratio: 0.0}
